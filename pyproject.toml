[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cogc-skill"
version = "0.2.1"
description = "Experimental capacity-aware cognitive compression for AI agents with provenance and fidelity checks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "CogC contributors"}]
keywords = ["agent-skills", "ai-agents", "cognitive-compression", "context-compression", "context-engineering", "context-management", "small-language-models", "slm", "llm-agents", "local-llm", "prompt-compression", "agent-memory", "procedural-memory", "agent-handoffs", "provenance", "fidelity", "multi-agent-systems", "qwen", "llmlingua"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[project.scripts]
cogc = "cogc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cogc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
