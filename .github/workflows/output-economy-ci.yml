name: Output Economy Integration Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify shared policy integration and criticality
        run: python -m pytest -q tests/test_compile.py tests/test_fidelity.py tests/test_dedup_priority.py
