name: Output Economy Integration Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify skill mirror and embedded engine are in sync
        run: python tools/sync_skill.py --check
      - name: Run full test suite (includes criticality and layout gates)
        run: python -m pytest -q
